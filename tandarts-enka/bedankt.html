<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Bedankt</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:#042a2b;color:#fff;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.box{max-width:440px}
.ok{width:72px;height:72px;border-radius:50%;background:#9fe3c7;color:#042a2b;display:grid;place-items:center;margin:0 auto 24px;font-size:36px;font-weight:800}
h1{font:800 30px/1.15 Montserrat,sans-serif;margin-bottom:14px}
p{color:#cfe0de;font-size:16px;line-height:1.55}
</style>
</head>
<body>
<div class="box">
  <div class="ok">✓</div>
  <h1>Bedankt voor uw reactie</h1>
  <p>We hebben uw gegevens goed ontvangen. Zodra er meer bekend is over de praktijk in ENKA, hoort u van ons.</p>
</div>
</body>
</html>
