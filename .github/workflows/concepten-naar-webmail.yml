name: Concepten naar webmail

# Zet de pitchmails van vandaag als CONCEPT in info@headturners.nl.
# Verzendt nooit: het script schrijft alleen naar de map Concepten (IMAP).
on:
  push:
    branches: [concepten]
    paths: ["concepten/*.json"]
  workflow_dispatch:
    inputs:
      datum:
        description: "Datum (JJJJ-MM-DD), leeg = vandaag"
        required: false

concurrency:
  group: concepten-naar-webmail
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  concepten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: concepten

      - name: Concepten in de map Concepten zetten
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          DATUM: ${{ github.event.inputs.datum }}
        run: python3 scripts/concepten_naar_webmail.py
